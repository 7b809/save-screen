<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="mb-1">Share Studio</h2>
      <p class="text-muted">Screen sharing, audio sharing, or both.</p>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label">Sharing mode</label>
          <select id="mode" class="form-select">
            <option value="both" selected>Screen + Audio (Default)</option>
            <option value="screen">Screen only</option>
            <option value="audio">Audio only</option>
          </select>
        </div>
      </div>

      <div class="d-flex gap-2 flex-wrap">
        <button id="startBtn" class="btn btn-primary">Start sharing</button>
        <button id="stopBtn" class="btn btn-danger" disabled>Stop & save</button>
      </div>

      <div class="mt-4">
        <video id="preview" class="w-100 rounded border" autoplay muted controls></video>
        <audio id="audioPreview" class="w-100 mt-3" autoplay controls></audio>
      </div>

      <div id="status" class="alert alert-secondary mt-3">Ready.</div>
      <a id="downloadLink" class="d-none" target="_blank"></a>
    </div>
  </div>
</div>
<script src="/static/js/app.js"></script>
</body>
</html>
